image: docker:20.10.16

include:
  - project: 'hellosanta/standards'
    ref: 2.x
    file: '/ci-templates/jobs/notifiation_mattermost.yml'

services:
  - docker:20.10.16-dind

default:
  tags:
    - docker

stages:
  - build
  - push
  - notify

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TAG: "php7.4-apache"

before_script:
  - docker info

build:
  stage: build
  script:
    # --no-cache：舊 Debian 的套件來源下架後，用 --cache-from 建置時每一層都命中快取，
    # 排程建置看起來一直成功，其實已經不能從頭建（php7.4、8.1 就是這樣沒被發現）。
    # 每次從頭建，來源出問題時排程建置會直接失敗。
    - docker build --pull --no-cache --tag $CI_REGISTRY_IMAGE:$DOCKER_TAG .
    - docker push $CI_REGISTRY_IMAGE:$DOCKER_TAG
  only:
    refs:
      - php7.4-apache

push:
  stage: push
  image: ubuntu:20.04
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    - eval $(ssh-agent -s)
    - echo "$runner_ssh_key" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - git remote show origin
    - git remote set-url --push origin git@github.com:HelloSanta/php4drupal.git
    - git remote show origin
    - git push --follow-tags origin HEAD:$CI_COMMIT_REF_NAME
  only:
    refs:
      - php7.4-apache

# TG-4913：搬到 trixie 前，在這個工作分支建一個測試 tag（php7.4-apache-trixie-test）給 hs69 測試站驗證；
# 不推正式 tag、不推 GitHub。合併進 php7.4-apache 之前拿掉這個 job。
build-test:
  stage: build
  # 只有 server0（runner 24）掛 docker 標籤、一次只跑一個建置；測試 tag 改用其他 runner 並行建置
  tags:
    - drupal
  script:
    - docker build --pull --no-cache --tag $CI_REGISTRY_IMAGE:php7.4-apache-trixie-test .
    - docker push $CI_REGISTRY_IMAGE:php7.4-apache-trixie-test
  only:
    refs:
      - feature/tg-4913-php7.4-trixie-v2

Mattermost:
  extends: .mattermost
  stage: notify
  variables:
    PAYLOAD: '{
      "text": "* 執行狀態: `錯誤`\n* 專案名稱: $CI_PROJECT_NAME\n* 專案分支: $CI_COMMIT_BRANCH\n* 專案作者: @$GITLAB_USER_LOGIN\n* Message: $CI_COMMIT_MESSAGE\n* 查看連結: $CI_PIPELINE_URL",
      "channel": "docker-build-automation",
      "username": "Docker自動部署小幫手"}'
  when: on_failure
