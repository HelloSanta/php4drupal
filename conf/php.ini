max_input_vars = 2000
memory_limit = 128M
post_max_size = 10M
upload_max_filesize = 10M
opcache.jit_buffer_size=0
opcache.jit=disable

; Fatal errors that never reach Drupal's handler (out of memory, timeouts,
; errors before bootstrap) go to the Apache error log, i.e. stderr / docker logs.
; Production error handling: never print PHP errors into the response. With the
; built-in defaults (display_errors on) anything raised before the application's
; own handler takes over - compile-time deprecations on the first request after
; a deploy, early bootstrap warnings - was shown to visitors. Errors still go to
; the log below. error_reporting is this PHP version's php.ini-production value.
; A test site that wants errors on screen sets that in its own settings.local.php.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; PHP2Shell (CVE-2026-109619): session upload progress is one of the confirmed
; attack paths, and PHP recommends keeping it off when unused. Drupal never uses
; it (D7 uses uploadprogress / APC, D8+ only uploadprogress).
session.upload_progress.enabled = Off
