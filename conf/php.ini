max_input_vars = 2000
memory_limit = 128M
post_max_size = 10M
upload_max_filesize = 10M
opcache.jit_buffer_size=256M
opcache.jit=1255

; Fatal errors that never reach Drupal's handler (out of memory, timeouts,
; errors before bootstrap) go to the Apache error log, i.e. stderr / docker logs.
log_errors = On

; PHP2Shell (CVE-2026-109619): session upload progress is one of the confirmed
; attack paths, and PHP recommends keeping it off when unused. Drupal never uses
; it (D7 uses uploadprogress / APC, D8+ only uploadprogress).
session.upload_progress.enabled = Off
