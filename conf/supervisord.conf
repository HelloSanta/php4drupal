[unix_http_server]
file=/dev/shm/supervisor.sock   ; (the path to the socket file)

; Required for supervisorctl to control supervisord. Without these two
; sections `supervisorctl status/restart` fails inside the container and the
; only way to restart a service is restarting the whole container.
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///dev/shm/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log ; (main log file;default $CWD/supervisord.log)
logfile_maxbytes=10KB        ; (max main logfile bytes b4 rotation;default 50MB)
logfile_backups=10           ; (num of main logfile rotation backups;default 10)
loglevel=info                ; (log level;default info; others: debug,warn,trace)
pidfile=/tmp/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
nodaemon=false               ; (start in foreground if true;default false)
minfds=1024                  ; (min. avail startup file descriptors;default 1024)
minprocs=200                 ; (min. avail process descriptors;default 200)
user=root		     		 ;

[program:sshd]
command=/usr/sbin/sshd -D

[program:apache2]
; Use the official php:*-apache entrypoint instead of calling apache2
; directly. It does `rm -f "$APACHE_PID_FILE"` before exec: /var/run is part
; of the container writable layer, so a stale apache2.pid survives
; `docker restart`, and when the PID it records is alive again (supervisord
; starts apache2 then sshd back to back, so sshd is always apache's PID+1 --
; an off-by-one between restarts is enough) Apache prints
; "httpd (pid N) already running" and exits 0. It also sources envvars and
; creates the APACHE_*_DIR directories.
command=/usr/local/bin/apache2-foreground
; supervisord defaults to autorestart=unexpected with exitcodes=0, so the
; exit 0 above counted as a normal shutdown: Apache stayed down with no
; restart and no warning. Always restart instead.
autorestart=true
startretries=10
; Send startup errors to `docker logs`. AUTO child logfiles land in /tmp and
; supervisord deletes them on shutdown, which destroyed the evidence during
; the incident. stdout is left on AUTO on purpose -- it carries the access
; log and would flood the container log driver.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
